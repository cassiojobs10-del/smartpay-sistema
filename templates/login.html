<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso ao Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #b91c1c;
      --bloom-color: rgba(37, 99, 235, 0.96);
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    [data-theme="dark"] {
      --bg: #0b0f17;
      --surface: #111827;
      --surface-2: #1a2334;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #243044;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger-bg: rgba(185, 28, 28, 0.16);
      --danger-border: rgba(248, 113, 113, 0.35);
      --danger-text: #fca5a5;
      --bloom-color: rgba(59, 130, 246, 0.96);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      animation: cardEnter 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      transition: opacity 0.35s ease, transform 0.35s ease, background-color 0.25s ease, border-color 0.25s ease;
      position: relative;
      z-index: 10;
    }

    .login-card.bloom-exit {
      opacity: 0;
      transform: scale(0.94);
      pointer-events: none;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-header {
      margin-bottom: 24px;
      text-align: center;
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 13.5px;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
      color: var(--text);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      color: var(--muted);
      display: flex;
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
      background: var(--surface);
    }

    .alert-error {
      display: none;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .alert-error.show {
      display: block;
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-submit.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hint-text {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    /* Transição de Bloom */
    .bloom-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, var(--bloom-color) 0%, var(--primary) 55%, var(--bg) 100%);
      transform: scale(0.08);
      border-radius: 50%;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease, border-radius 0.65s ease;
    }

    .bloom-overlay.active {
      opacity: 1;
      transform: scale(2.8);
      border-radius: 0%;
    }

    .bloom-label {
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.35s ease 0.15s, transform 0.35s ease 0.15s;
    }

    .bloom-overlay.active .bloom-label {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
    🌙 Tema
  </button>

  <main class="login-card" id="loginCard">
    <div class="login-header">
      <h1>Entrar</h1>
      <p>Use sua matrícula e sua senha</p>
    </div>

    <div class="alert-error" id="alertError" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="usuario">Matrícula</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input
            type="text"
            id="usuario"
            name="usuario"
            class="form-control"
            placeholder="Ex: 12345"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input
            type="password"
            id="senha"
            name="senha"
            class="form-control"
            placeholder="Sua senha ou data de nascimento"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span class="spinner"></span>
        <span>Acessar</span>
      </button>
    </form>

    <p class="hint-text">No primeiro acesso sem senha definida, informe sua data de nascimento.</p>
  </main>

  <div class="bloom-overlay" id="bloomOverlay" aria-hidden="true">
    <span class="bloom-label">Acesso autorizado</span>
  </div>

  <script>
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById("themeToggle");
    const loginForm = document.getElementById("loginForm");
    const loginCard = document.getElementById("loginCard");
    const alertError = document.getElementById("alertError");
    const btnSubmit = document.getElementById("btnSubmit");
    const bloomOverlay = document.getElementById("bloomOverlay");

    function applyTheme(theme) {
      if (theme === "dark") {
        htmlEl.setAttribute("data-theme", "dark");
        themeToggle.textContent = "☀️ Claro";
      } else {
        htmlEl.removeAttribute("data-theme");
        themeToggle.textContent = "🌙 Escuro";
      }
      localStorage.setItem("ui_theme", theme);
    }

    const savedTheme = localStorage.getItem("ui_theme") || "dark";
    applyTheme(savedTheme);

    themeToggle.addEventListener("click", () => {
      const current = htmlEl.getAttribute("data-theme") === "dark" ? "dark" : "light";
      applyTheme(current === "dark" ? "light" : "dark");
    });

    function showError(msg) {
      alertError.textContent = msg;
      alertError.classList.add("show");
    }

    function hideError() {
      alertError.textContent = "";
      alertError.classList.remove("show");
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if (!usuario || !senha) {
        showError("Preencha a matrícula e a senha.");
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.classList.add("loading");

      try {
        const resp = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, senha }),
        });

        const data = await resp.json();

        if (!resp.ok || data.status !== "sucesso") {
          showError(data.mensagem || "Não foi possível autenticar.");
          btnSubmit.disabled = false;
          btnSubmit.classList.remove("loading");
          return;
        }

        loginCard.classList.add("bloom-exit");
        bloomOverlay.classList.add("active");

        setTimeout(() => {
          window.location.href = data.redirect || "/";
        }, 620);
      } catch (err) {
        showError("Erro de conexão com o servidor.");
        btnSubmit.disabled = false;
        btnSubmit.classList.remove("loading");
      }
    });
  </script>
</body>
</html>
