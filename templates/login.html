<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Gerência Financeira</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ==========================================
           SISTEMA DE TEMAS (CLARO E ESCURO)
           ========================================== */
        :root {
            --bg-body: #f3f4f6;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-input: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: rgba(229, 231, 235, 0.8);
            --btn-primary: #111827;
            --btn-primary-text: #ffffff;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            --shadow-btn: 0 4px 12px rgba(17, 24, 39, 0.2);
            --danger-bg: rgba(239, 68, 68, 0.1);
            --danger-text: #ef4444;
        }

        [data-theme="dark"] {
            --bg-body: #09090b;
            --bg-card: rgba(24, 24, 27, 0.85);
            --bg-input: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: rgba(39, 39, 42, 0.8);
            --btn-primary: #ffffff;
            --btn-primary-text: #000000;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            --shadow-btn: 0 4px 12px rgba(255, 255, 255, 0.1);
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-text: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* FUNDO COM AS ONDAS FLUIDAS (LIQUID WAVE) */
        #waveCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* BOTÃO DE TEMA */
        .theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            font-size: 16px;
            z-index: 10;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .theme-toggle:hover {
            border-color: var(--text-muted);
        }

        /* CARD DE LOGIN COM EFEITO VIDRO (BACKDROP-FILTER) */
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-card);
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background-color: var(--text-main);
            color: var(--bg-body);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 16px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }
        .form-input {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 14px 16px 14px 44px;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            width: 100%;
        }
        .form-input:focus {
            border-color: var(--text-main);
            background-color: var(--bg-card);
        }

        .btn-submit {
            background-color: var(--btn-primary);
            color: var(--btn-primary-text);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            padding: 16px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .alert-error {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- CANVAS DAS ONDAS FLUIDAS (ÁGUA AGITADA) -->
    <canvas id="waveCanvas"></canvas>

    <!-- BOTÃO DE TEMA -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Mudar Tema">
        <i id="theme-icon" class="fa-solid fa-moon"></i>
    </button>

    <div class="login-card">
        
        <div class="login-header">
            <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
            <h1 class="login-title">Gerência Financeira</h1>
            <p class="login-subtitle">Acesso restrito a colaboradores e gestores</p>
        </div>

        {% if erro %}
        <div class="alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" id="loginForm" onsubmit="iniciarCarregamento()">
            
            <div class="form-group">
                <label for="usuario">Matrícula de Acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card input-icon"></i>
                    <input 
                        type="text" 
                        id="usuario" 
                        name="usuario" 
                        class="form-input" 
                        placeholder="Ex: 12345" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha (Data de Nascimento)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        class="form-input" 
                        placeholder="dd/mm/aa" 
                        required 
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnAcessar">
                <span>Acessar Sistema</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>

        </form>

        <div class="login-footer">
            <span>&copy; 2026 Smartpay &bull; Gestão Corporativa</span>
        </div>

    </div>

    <script>
        // ==========================================
        // ANIMAÇÃO DE ÁGUA/ONDAS FLUIDAS (LIQUID WAVES)
        // ==========================================
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let step = 0;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawWaves() {
            ctx.clearRect(0, 0, width, height);
            step += 0.012; // Velocidade da ondulação da água

            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            
            // Definição de 3 camadas de ondas com tons elegantes
            const waves = [
                {
                    amplitude: 45,
                    frequency: 0.003,
                    speed: 1.0,
                    heightOffset: height * 0.72,
                    color: isDark ? 'rgba(39, 39, 42, 0.45)' : 'rgba(229, 231, 235, 0.7)'
                },
                {
                    amplitude: 35,
                    frequency: 0.005,
                    speed: 1.5,
                    heightOffset: height * 0.76,
                    color: isDark ? 'rgba(63, 63, 70, 0.35)' : 'rgba(209, 213, 219, 0.55)'
                },
                {
                    amplitude: 25,
                    frequency: 0.007,
                    speed: 2.0,
                    heightOffset: height * 0.82,
                    color: isDark ? 'rgba(82, 82, 91, 0.25)' : 'rgba(156, 163, 175, 0.4)'
                }
            ];

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.moveTo(0, height);
                ctx.lineTo(0, wave.heightOffset);

                for (let x = 0; x <= width; x += 10) {
                    const y = Math.sin(x * wave.frequency + step * wave.speed) * wave.amplitude +
                              Math.cos(x * 0.002 + step * 0.8) * (wave.amplitude * 0.4) +
                              wave.heightOffset;
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(width, height);
                ctx.closePath();
                ctx.fillStyle = wave.color;
                ctx.fill();
            });

            requestAnimationFrame(drawWaves);
        }

        drawWaves();

        // =====================================
        // CONTROLE DO TEMA
        // =====================================
        function toggleTheme() {
            const body = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun';
        }

        function iniciarCarregamento() {
            const btn = document.getElementById('btnAcessar');
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Verificando credenciais...</span>';
        }
    </script>
</body>
</html>
