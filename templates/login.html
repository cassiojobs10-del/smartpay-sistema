<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Gerência Financeira</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --bg-input: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --btn-primary: #111827;
            --btn-primary-text: #ffffff;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            --shadow-btn: 0 4px 12px rgba(17, 24, 39, 0.2);
            --danger-bg: rgba(239, 68, 68, 0.1);
            --danger-text: #ef4444;
            
            /* Cor do líquido que sobe (Transição) */
            --liquid-color: #111827;
            --liquid-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-body: #09090b;
            --bg-card: #18181b;
            --bg-input: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --btn-primary: #ffffff;
            --btn-primary-text: #000000;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-btn: 0 4px 12px rgba(255, 255, 255, 0.1);
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-text: #f87171;
            
            --liquid-color: #000000;
            --liquid-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* BOTÃO DE TEMA */
        .theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            font-size: 16px;
            z-index: 10;
        }

        /* CARD DE LOGIN */
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-card);
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 5;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background-color: var(--text-main);
            color: var(--bg-body);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 16px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .form-group label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }
        .form-input {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 14px 16px 14px 44px;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            width: 100%;
        }
        .form-input:focus {
            border-color: var(--text-main);
            background-color: var(--bg-card);
        }

        .btn-submit {
            background-color: var(--btn-primary);
            color: var(--btn-primary-text);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            padding: 16px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .alert-error {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ==========================================================
           TRANSIÇÃO LÍQUIDA AO ACESSAR (WAVE TRANSITION)
           ========================================================== */
        .liquid-transition-overlay {
            position: fixed;
            left: 0;
            top: 100%;
            width: 100%;
            height: 100vh;
            background-color: var(--liquid-color);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: top 1.2s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .liquid-transition-overlay.active {
            top: 0%;
        }

        /* ONDAS SVG NA BORDA SUPERIOR DA TRANSIÇÃO */
        .liquid-waves {
            position: absolute;
            bottom: 99%;
            left: 0;
            width: 200%;
            height: 140px;
            display: flex;
            animation: waveMotion 2.5s infinite linear;
        }

        .liquid-waves svg {
            width: 50%;
            height: 100%;
            fill: var(--liquid-color);
        }

        @keyframes waveMotion {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        /* CONTEÚDO QUE APARECE DENTRO DA ONDA QUANDO ELA COBRE A TELA */
        .liquid-content {
            text-align: center;
            color: var(--liquid-text);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease 0.6s, transform 0.6s ease 0.6s;
        }

        .liquid-transition-overlay.active .liquid-content {
            opacity: 1;
            transform: translateY(0);
        }

        .liquid-logo {
            width: 60px;
            height: 60px;
            background-color: var(--liquid-text);
            color: var(--liquid-color);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- OVERLAY DA TRANSIÇÃO LÍQUIDA (ÁGUA AGITADA AO ACESSAR) -->
    <div id="liquidOverlay" class="liquid-transition-overlay">
        <div class="liquid-waves">
            <!-- Duas ondas unidas para formar o movimento infinito -->
            <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,218.7C960,235,1056,213,1152,186.7C1248,160,1344,128,1392,112L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
            <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,218.7C960,235,1056,213,1152,186.7C1248,160,1344,128,1392,112L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>
        </div>
        <div class="liquid-content">
            <div class="liquid-logo"><i class="fa-solid fa-layer-group"></i></div>
            <h2 style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">Gerência Financeira</h2>
            <p style="font-size: 14px; opacity: 0.8; margin-top: 6px; font-weight: 500;">Preparando ambiente seguro...</p>
        </div>
    </div>

    <!-- BOTÃO DE TEMA -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Mudar Tema">
        <i id="theme-icon" class="fa-solid fa-moon"></i>
    </button>

    <div class="login-card">
        
        <div class="login-header">
            <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
            <h1 class="login-title">Gerência Financeira</h1>
            <p class="login-subtitle">Acesso restrito a colaboradores e gestores</p>
        </div>

        <div id="alertError" class="alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorMsg">Matrícula ou data de nascimento incorretos.</span>
        </div>

        <form id="loginForm" onsubmit="realizarLoginComOnda(event)">
            
            <div class="form-group">
                <label for="usuario">Matrícula de Acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card input-icon"></i>
                    <input 
                        type="text" 
                        id="usuario" 
                        class="form-input" 
                        placeholder="Ex: 12345" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha (Data de Nascimento)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="senha" 
                        class="form-input" 
                        placeholder="dd/mm/aa" 
                        required 
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnAcessar">
                <span>Acessar Sistema</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>

        </form>

        <div class="login-footer">
            <span>&copy; 2026 Smartpay &bull; Gestão Corporativa</span>
        </div>

    </div>

    <script>
        // =====================================
        // CONTROLE DO TEMA (CLARO / ESCURO)
        // =====================================
        function toggleTheme() {
            const body = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun';
        }

        // =====================================
        // LOGIN COM TRANSIÇÃO LÍQUIDA (WAVE EFFECT)
        // =====================================
        async function realizarLoginComOnda(event) {
            event.preventDefault(); // Impede o reload padrão da página

            const btn = document.getElementById('btnAcessar');
            const alertBox = document.getElementById('alertError');
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;

            // Esconde alertas de erro antigos
            alertBox.style.display = 'none';

            // Efeito de carregamento no botão
            const textoOriginal = btn.innerHTML;
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Autenticando...</span>';

            try {
                // Envia credenciais para o servidor sem recarregar a tela
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuario, senha: senha })
                });

                const dados = await resposta.json();

                if (resposta.ok && dados.status === 'sucesso') {
                    // SENHA CORRETA! DISPARA A ONDA LÍQUIDA
                    const liquid = document.getElementById('liquidOverlay');
                    liquid.classList.add('active');

                    // Aguarda 1.4 segundos para a água cobrir a tela antes de abrir o painel
                    setTimeout(() => {
                        window.location.href = dados.redirect || '/';
                    }, 1400);
                } else {
                    // ERRO DE SENHA OU MATRÍCULA
                    alertBox.style.display = 'flex';
                    document.getElementById('errorMsg').innerText = dados.mensagem || "Credenciais incorretas.";
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                    btn.innerHTML = textoOriginal;
                }
            } catch (erro) {
                alertBox.style.display = 'flex';
                document.getElementById('errorMsg').innerText = "Erro ao conectar com o servidor. Tente novamente.";
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                btn.innerHTML = textoOriginal;
            }
        }
    </script>
</body>
</html>
