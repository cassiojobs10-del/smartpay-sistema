<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Gerência Financeira</title>
    <!-- Fonte corporativa moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ==========================================
           SISTEMA DE TEMAS (CLARO E ESCURO)
           ========================================== */
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --bg-input: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --btn-primary: #111827;
            --btn-primary-text: #ffffff;
            --shadow-card: 0 20px 40px rgba(0, 0, 0, 0.05);
            --shadow-btn: 0 4px 12px rgba(17, 24, 39, 0.2);
            --danger-bg: rgba(239, 68, 68, 0.1);
            --danger-text: #ef4444;
            
            /* Cores específicas do Efeito Bloom */
            --bloom-bg: #111827;
            --bloom-glow: rgba(17, 24, 39, 0.4);
            --bloom-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-body: #09090b;
            --bg-card: #18181b;
            --bg-input: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --btn-primary: #ffffff;
            --btn-primary-text: #000000;
            --shadow-card: 0 25px 50px rgba(0, 0, 0, 0.4);
            --shadow-btn: 0 4px 12px rgba(255, 255, 255, 0.1);
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-text: #f87171;
            
            --bloom-bg: #ffffff;
            --bloom-glow: rgba(255, 255, 255, 0.35);
            --bloom-text: #09090b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* BOTÃO DE TEMA */
        .theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            font-size: 16px;
            z-index: 10;
        }
        .theme-toggle:hover {
            border-color: var(--text-muted);
        }

        /* CARD DE LOGIN */
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-card);
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 5;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        /* Animação para esconder o card quando o Bloom iniciar */
        .login-card.bloom-active {
            transform: scale(0.92);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background-color: var(--text-main);
            color: var(--bg-body);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 16px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }
        .form-input {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 14px 16px 14px 44px;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            width: 100%;
        }
        .form-input:focus {
            border-color: var(--text-main);
            background-color: var(--bg-card);
        }

        .btn-submit {
            background-color: var(--btn-primary);
            color: var(--btn-primary-text);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            padding: 16px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* ALERTA DE ERRO */
        .alert-error {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ==========================================================
           TRANSIÇÃO DE BLOOM (BLOOM TRANSITION EFFECT)
           ========================================================== */
        .bloom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 100;
        }

        /* O círculo luminoso que se expande do meio da tela */
        .bloom-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: var(--bloom-bg);
            box-shadow: 0 0 80px 40px var(--bloom-glow), 0 0 160px 80px var(--bloom-bg);
            transform: scale(0);
            opacity: 0;
            transition: transform 0.85s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.4s ease;
            will-change: transform, opacity;
        }

        /* Quando ativado, o Bloom expande para preencher e iluminar toda a viewport */
        .bloom-overlay.active .bloom-circle {
            transform: scale(180);
            opacity: 1;
        }

        /* Conteúdo que surge suavemente no centro do clarão do Bloom */
        .bloom-content {
            position: absolute;
            z-index: 101;
            text-align: center;
            color: var(--bloom-text);
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.4s ease 0.35s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.35s;
        }

        .bloom-overlay.active .bloom-content {
            opacity: 1;
            transform: scale(1);
        }

        .bloom-logo {
            width: 64px;
            height: 64px;
            background-color: var(--bloom-text);
            color: var(--bloom-bg);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- OVERLAY DA TRANSIÇÃO DE BLOOM -->
    <div id="bloomOverlay" class="bloom-overlay">
        <div class="bloom-circle"></div>
        <div class="bloom-content">
            <div class="bloom-logo"><i class="fa-solid fa-layer-group"></i></div>
            <h2 style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">Gerência Financeira</h2>
            <p style="font-size: 13px; opacity: 0.85; margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Acessando ambiente...</p>
        </div>
    </div>

    <!-- BOTÃO DE TEMA -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Mudar Tema">
        <i id="theme-icon" class="fa-solid fa-moon"></i>
    </button>

    <div class="login-card" id="loginCard">
        
        <div class="login-header">
            <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
            <h1 class="login-title">Gerência Financeira</h1>
            <p class="login-subtitle">Acesso restrito a colaboradores e gestores</p>
        </div>

        <div id="alertError" class="alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorMsg">Matrícula ou data de nascimento incorretos.</span>
        </div>

        <form id="loginForm" onsubmit="realizarLoginComBloom(event)">
            
            <div class="form-group">
                <label for="usuario">Matrícula de Acesso</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card input-icon"></i>
                    <input 
                        type="text" 
                        id="usuario" 
                        class="form-input" 
                        placeholder="Ex: 12345" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha (Data de Nascimento)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="senha" 
                        class="form-input" 
                        placeholder="dd/mm/aa" 
                        required 
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnAcessar">
                <span>Acessar Sistema</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>

        </form>

        <div class="login-footer">
            <span>&copy; 2026 Smartpay &bull; Gestão Corporativa</span>
        </div>

    </div>

    <script>
        // =====================================
        // CONTROLE DO TEMA (CLARO / ESCURO)
        // =====================================
        function toggleTheme() {
            const body = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun';
        }

        // =====================================
        // LOGIN COM TRANSIÇÃO DE BLOOM (BLOOM EFFECT)
        // =====================================
        async function realizarLoginComBloom(event) {
            event.preventDefault(); // Impede o reload padrão da página

            const btn = document.getElementById('btnAcessar');
            const alertBox = document.getElementById('alertError');
            const card = document.getElementById('loginCard');
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;

            // Oculta alertas anteriores
            alertBox.style.display = 'none';

            // Efeito de carregamento no botão
            const textoOriginal = btn.innerHTML;
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Verificando...</span>';

            try {
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuario, senha: senha })
                });

                const dados = await resposta.json();

                if (resposta.ok && dados.status === 'sucesso') {
                    // 1. Inicia o efeito Bloom
                    const bloom = document.getElementById('bloomOverlay');
                    bloom.classList.add('active');
                    
                    // 2. O cartão de login encolhe suavemente no meio do clarão
                    card.classList.add('bloom-active');

                    // 3. Aguarda cerca de 950ms para a animação completar com elegância antes do redirecionamento
                    setTimeout(() => {
                        window.location.href = dados.redirect || '/';
                    }, 950);
                } else {
                    // ERRO DE SENHA OU MATRÍCULA
                    alertBox.style.display = 'flex';
                    document.getElementById('errorMsg').innerText = dados.mensagem || "Credenciais incorretas.";
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                    btn.innerHTML = textoOriginal;
                }
            } catch (erro) {
                alertBox.style.display = 'flex';
                document.getElementById('errorMsg').innerText = "Erro ao conectar com o servidor. Tente novamente.";
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                btn.innerHTML = textoOriginal;
            }
        }
    </script>
</body>
</html>
